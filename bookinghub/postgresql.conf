# =============================================
# postgresql.conf — BookingHub
# =============================================

# Conexões
max_connections = 100

# Memória
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 64MB

# WAL e Durabilidade
wal_level = replica
archive_mode = on
archive_command = 'cp %p /wal_archive/%f'
archive_timeout = 60

# Checkpoints
checkpoint_completion_target = 0.9
# checkpoint_timeout = 5min  # padrão

# Performance
synchronous_commit = on
effective_cache_size = 512MB

# Logs (útil para depuração durante o trabalho)
log_min_duration_statement = 100   # loga queries > 100ms
log_checkpoints = on
log_lock_waits = on
log_line_prefix = '%t [%p] %u@%d '

# Recovery (Point-in-Time Recovery)
# Descomentar apenas durante restore:
# restore_command = 'cp /wal_archive/%f %p'
# recovery_target_time = '2026-06-07 12:00:00'
# recovery_target_action = promote
