services:
  db:
    image: postgres:16
    container_name: bookinghub_db
    environment:
      POSTGRES_DB: bookinghub
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./wal_archive:/wal_archive
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
      - ./sql:/sql
    ports:
      - "5432:5432"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d bookinghub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: bookinghub_api
    environment:
      DATABASE_URL: postgresql://booking:secret@db:5432/bookinghub
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app

volumes:
  pgdata:
